<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
</head>

<body class="bro">

<div class="Parent">

    <input type="text" class="space" >
    <div class="sub-parent">

        <button class="button num">1</button>
        <button class="button num">2</button>
        <button class="button num">3</button>
        <button class="button num">4</button>
        <button class="button num">5</button>
        <button class="button num">6</button>
        <button class="button num">7</button>
        <button class="button num">8</button>
        <button class="button num">9</button>
        <button class="button num">0</button>
        <button class="button opr plus">+</button>
        <button class="button opr minus" >-</button>
        <button class="button opr times">x</button>
        <button class="button opr divide">/</button>
        <button class="button opr equal">=</button>
        <button class="btnss">D</button>
        <button class="btns">C</button>

    </div>

</div>

<script src="Calculator.js"></script>

</body>
</html>
